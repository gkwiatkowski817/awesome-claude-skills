plugins {
    id 'com.android.application'
}

android {
    namespace 'com.homevault.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.homevault.app'
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Align all transitive kotlin-stdlib variants so the jdk7/jdk8 artifacts
    // don't clash with the newer stdlib (avoids "Duplicate class" build errors).
    implementation platform('org.jetbrains.kotlin:kotlin-bom:1.9.24')
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.webkit:webkit:1.11.0'
}

// Bundle the PWA's web files into the APK's assets before each build.
tasks.register('syncWebAssets', Copy) {
    from("${rootDir}/..") {
        include 'index.html'
        include 'app.js'
        include 'styles.css'
        include 'manifest.webmanifest'
        include 'service-worker.js'
        include 'data/**'
        include 'icons/**'
    }
    into "${projectDir}/src/main/assets/www"
}

afterEvaluate {
    tasks.named('preBuild').configure { dependsOn 'syncWebAssets' }
}
