name: Build Network Scanner APK

on:
  push:
    branches:
      - claude/android-network-device-scanner-lggspw
    paths:
      - 'android-network-scanner/**'
  workflow_dispatch:

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "sdk.dir=$ANDROID_HOME" > android-network-scanner/local.properties

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('android-network-scanner/**/*.gradle*', 'android-network-scanner/**/libs.versions.toml') }}
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Make gradlew executable
        run: chmod +x android-network-scanner/gradlew

      - name: Build Debug APK
        run: |
          cd android-network-scanner
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: NetworkScanner-debug
          path: android-network-scanner/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Display APK info
        run: |
          APK=android-network-scanner/app/build/outputs/apk/debug/app-debug.apk
          if [ -f "$APK" ]; then
            echo "APK built successfully"
            ls -lh "$APK"
            $ANDROID_HOME/build-tools/$(ls $ANDROID_HOME/build-tools | tail -1)/aapt dump badging "$APK" | head -5
          fi
